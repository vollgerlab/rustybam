[package]
authors = ["Mitchell R. Vollger <mrvollger@gmail.com>"]
build = "build.rs"                                      # not yet stable enough
categories = ["command-line-utilities"]
description = "bioinformatics toolkit in rust"
edition = "2021"
exclude = ["benchmarks/"]
homepage = "https://vollgerlab.com/rustybam/"
keywords = ["cli", "bam", "paf", "liftover"]
license = "MIT"
name = "rustybam"
readme = "README.md"
repository = "https://github.com/vollgerlab/rustybam"
version = "0.3.0"

[[bin]]
name = "rb"
path = "src/main.rs"

[[bin]]
name = "rustybam"
path = "src/main.rs"

[features]
default = ["deflate_zlib_ng", "snap_default", "libdeflate"]

deflate_rust = ["gzp/deflate_rust", "flate2/rust_backend"]
deflate_zlib = ["gzp/deflate_zlib", "flate2/zlib", "any_zlib"]
deflate_zlib_ng = ["gzp/deflate_zlib_ng", "flate2/zlib-ng-compat", "any_zlib"]
libdeflate = ["gzp/libdeflate"]
snap_default = ["gzp/snappy_default", "snap", "snappy"]

any_zlib = [] # internal feature flag
snappy = []   # internal feature flag

[dependencies]
anyhow = "1.0.71"
bimap = "0.6.3"
bio = "4.0"
bio-types = "1.0"
linear-map = "1.2.0"
calm_io = "0.1.1"
chrono = "0.4.26"
clap = { version = "3.2.22", features = ["derive"] }
colored = "2.0.0"
env_logger = "0.9.0"
flate2 = { version = "~1", default-features = false }
gzp = { version = "0.11", default-features = false }
itertools = "0.10.0"
lazy_static = "1.4.0"
log = "0.4.19"
natord = "1.0.9"
needletail = "0.5.1"
num-format = "0.4.4"
rayon = "1.7"
niffler = { version = "2.5.0", default-features = false, features = ["gz"] }
regex = "1.8"
rust-htslib = "1.0"
snap = { version = "1.1", optional = true }
itoa = "1"

[build-dependencies]
clap = { version = "3.2.22", features = ["derive"] }
clap_complete = "3.2.5"
env_logger = "0.9.0"
log = "0.4.19"

# Release with debug symbols for profiling (samply, sample, etc.)
# Builds to target/profiling/ so it doesn't conflict with target/release/
[profile.profiling]
inherits = "release"
debug = 2

# generated by 'cargo dist init'
[profile.dist]
inherits = "release"
split-debuginfo = "packed"
